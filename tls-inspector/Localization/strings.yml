- key: What does this mean?
  values:
    en: What does this mean?
- key: whatDoesThisMean::trusted
  values:
    en: This means that your device was able to establish a secure and trusted connection to the host.
- key: whatDoesThisMean::locallyTrusted
  values:
    en: This means that your device has been configured to trust this connection even though it would not have done so normally.\n\nEnterprise or corporate devices may use these types of certificates for internal or private websites, but they can also be an indication of a compromised device or network.
- key: whatDoesThisMean::untrusted
  values:
    en: This means that your device was unable to establish a secure connection or did not have confidence in the identity of the remote host.
- key: whatDoesThisMean::invalidDate
  values:
    en: This means that the certificate used by the remote host is outside of its validity period. All certificates must have a date range for when they are valid, and this certificate is currently outside of that range.
- key: whatDoesThisMean::wrongHost
  values:
    en: This means that the certificate used by the remote host is not intended for the host you’ve connected to. Internet certificates only apply to specific domain names or IP addresses, and this certificate does not contain any values that match the host you’ve connected to.
- key: whatDoesThisMean::sha1Leaf
  values:
    en: This means that one or more certificates presented by the remote host uses the SHA-1 algorithm. This algorithm was widely used but has been found to be vulnerable and is no longer considered secure.
- key: whatDoesThisMean::sha1Intermediate
  values:
    en: This means that one or more certificates presented by the remote host uses the SHA-1 algorithm. This algorithm was widely used but has been found to be vulnerable and is no longer considered secure.
- key: whatDoesThisMean::selfSigned
  values:
    en: This means that the certificates presented by the remote host were not issued by a trusted certificate issuer or authority. Internet certificates are only trusted by your device if they were issued by responsible and reputable authorities.
- key: whatDoesThisMean::revokedLeaf
  values:
    en: This means that one or more certificates presented by the remote host have been marked as “revoked”. Certificates are revoked when they can no longer be trusted due to several reasons.
- key: whatDoesThisMean::revokedIntermediate
  values:
    en: This means that one or more certificates presented by the remote host have been marked as “revoked”. Certificates are revoked when they can no longer be trusted due to several reasons.
- key: whatDoesThisMean::weakRSAKey
  values:
    en: This means that one or more certificates presented by the remote host are using weak cryptography. Your device needs to be able to establish a secure connection to the remote host, but the remote host has requested that your device use insecure settings for that connection.
- key: whatDoesThisMean::issueDateTooLong
  values:
    en: This means that one or more certificates presented by the remote server are invalid.\n\nSpecifically, a certificate has too long of a lifetime. All internet certificates must define a date range for which they are valid, and your device has established a maximum for that range. This certificate exceeds that maximum range.
- key: whatDoesThisMean::leafMissingRequiredKeyUsage
  values:
    en: This means that the certificate presented by the remote server is invalid.\n\nSpecifically, it is missing required information about what that certificate can be used for. Internet certificates can only be used for specific tasks, and this certificate is missing the required tasks in what it’s allowed to be used for.
- key: whatDoesThisMean::unknownCriticalExtension
  values:
    en: This means that one or more certificates presented by the remote server are invalid.\n\nSpecifically, they contain information that is unknown to TLS Inspector but is marked as being critical. In this instance, the certificate cannot be trusted as TLS Inspector cannot process information that has been marked as critical.
- key: whatDoesThisMean::badAuthority
  values:
    en: This means that the certificate presented by the remote server was issued by a known untrustworthy & dangerous issuer or authority. 
